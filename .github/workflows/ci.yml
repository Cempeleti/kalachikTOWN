name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DME_FILE: roguetown.dme
  DMB_FILE: roguetown.dmb
  BYOND_ZIP: 516.1688_byond_linux.zip
  BYOND_VERSION: "516.1688"

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Все файлы подключены в .dme
        shell: bash
        run: |
          if [ -f tools/travis/check_filedirs.sh ]; then
            bash tools/travis/check_filedirs.sh "$DME_FILE"
          else
            echo "check_filedirs.sh не найден, шаг пропущен"
          fi

      - name: Валидность JSON
        shell: bash
        run: |
          if [ -f tools/json_verifier.py ]; then
            find . -name "*.json" \
              -not -path "*/node_modules/*" \
              -not -path "./strings/books/*" \
              -print0 | xargs -0 -n1 python3 ./tools/json_verifier.py
          else
            find . -name "*.json" \
              -not -path "*/node_modules/*" \
              -not -path "./strings/books/*" \
              -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
          fi

  compile:
    name: Compile check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 32-битные библиотеки
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libstdc++6:i386 zlib1g:i386 libcurl4:i386

      - name: Кэш BYOND
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: byond-${{ env.BYOND_VERSION }}

      - name: Установить BYOND
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -f "$BYOND_ZIP" ]; then
            echo "::error::Файл $BYOND_ZIP не найден в корне репозитория."
            exit 1
          fi
          mkdir -p "$HOME/BYOND"
          unzip -q "$BYOND_ZIP" -d "$HOME/BYOND"
          cd "$HOME/BYOND/byond"
          make here

      - name: Компиляция
        shell: bash
        run: |
          source "$HOME/BYOND/byond/bin/byondsetup"
          DreamMaker -DTRAVISBUILDING "$DME_FILE" 2>&1 | tee dm.log
          if grep -qE "[1-9][0-9]* errors?" dm.log; then
            echo "::error::Компиляция завершилась с ошибками"
            exit 1
          fi

  run-debug:
    name: Build, run and debug
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 32-битные библиотеки
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libstdc++6:i386 zlib1g:i386 libcurl4:i386

      - name: Кэш BYOND
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: byond-${{ env.BYOND_VERSION }}

      - name: Установить BYOND
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -f "$BYOND_ZIP" ]; then
            echo "::error::Файл $BYOND_ZIP не найден в корне репозитория."
            exit 1
          fi
          mkdir -p "$HOME/BYOND"
          unzip -q "$BYOND_ZIP" -d "$HOME/BYOND"
          cd "$HOME/BYOND/byond"
          make here

      - name: Сборка
        shell: bash
        run: |
          source "$HOME/BYOND/byond/bin/byondsetup"
          DreamMaker -DTRAVISBUILDING "$DME_FILE" 2>&1 | tee dm.log
          if grep -qE "[1-9][0-9]* errors?" dm.log; then
            echo "::error::Компиляция завершилась с ошибками"
            exit 1
          fi

      - name: Запуск сервера и проверка на runtime-ошибки
        shell: bash
        run: |
          source "$HOME/BYOND/byond/bin/byondsetup"
          mkdir -p data/logs/ci
          set +e
          timeout 120 DreamDaemon "$DMB_FILE" -close -trusted -verbose \
            -params "log-directory=ci" 2>&1 | tee run.log
          set -e

          echo "---- Поиск ошибок в логах ----"
          cat data/logs/ci/*.log run.log > all.log 2>/dev/null || true
          if grep -qiE "runtime error|runtime in|proc name:" all.log; then
            echo "::error::Во время запуска найдены runtime-ошибки"
            grep -iE -B2 -A6 "runtime error|runtime in" all.log | head -n 80
            exit 1
          fi
          echo "Сервер запустился без runtime-ошибок"

      - name: Сохранить логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-debug-logs
          path: |
            dm.log
            run.log
            data/logs/ci/
          if-no-files-found: ignore
